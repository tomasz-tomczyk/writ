name: Coverage

# Crit runs full tests on pull_request only and coverage on push to main.
# Keep a default-branch Codecov baseline without replaying the whole suite.

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: coverage
      - name: Generate LCOV
        run: mise run coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: target/llvm-cov/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
