name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: mise exec -- cargo fmt --all --check

      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: No HTTP client is linked into writ
        run: mise run no-network

      - name: Test
        run: mise exec -- cargo test --workspace --locked

  docs:
    name: the documented flags are real flags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary the documentation is checked against
        run: mise exec -- cargo build --bin writ --locked
      # Spec section 11, from crit #873. A flag in the README or a
      # SKILL.md that the binary rejects is a bug. Invariant 8.
      - name: README and every SKILL.md against writ --help
        run: ./scripts/check-doc-flags.sh

  install:
    name: cargo install resolves the writ binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Install from source
        run: mise exec -- cargo install --path crates/writ-cli --locked
      - name: The binary is named writ, not writ-cli
        run: writ --version

  lint:
    name: deny, machete, typos, shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Supply-chain, unused deps, typos, shell scripts
        run: mise run lint

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
      - name: Generate LCOV
        run: mise run coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/llvm-cov/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
