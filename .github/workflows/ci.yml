name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Warm the shared Cargo cache and produce the writ binary once.
  # Downstream jobs restore the cache (or the binary artifact) instead of
  # cold-compiling on every runner.
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Format
        run: mise exec -- cargo fmt --all --check

      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: No HTTP client is linked into writ
        run: mise run no-network

      - name: Compile tests (no run)
        run: mise exec -- cargo test --workspace --locked --no-run

      - name: Build writ
        run: mise exec -- cargo build --bin writ --locked

      - name: Upload writ binary
        uses: actions/upload-artifact@v4
        with:
          name: writ-bin
          path: target/debug/writ
          if-no-files-found: error
          retention-days: 1

  test:
    name: test
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: Test
        run: mise exec -- cargo test --workspace --locked

  docs:
    name: docs
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download writ binary
        uses: actions/download-artifact@v4
        with:
          name: writ-bin
          path: artifact
      - name: README and every SKILL.md against writ --help
        env:
          WRIT: ${{ github.workspace }}/artifact/writ
        run: |
          chmod +x "$WRIT"
          ./scripts/check-doc-flags.sh

  install:
    name: install
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: cargo install resolves the writ binary
        run: |
          mise exec -- cargo install --path crates/writ-cli --locked --force
          writ --version

  lint:
    name: lint
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - name: Supply-chain, unused deps, typos, shell scripts
        run: mise run lint

  # Instrumented rebuild — cannot reuse the compile job's target/.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: coverage
      - name: Generate LCOV
        run: mise run coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/llvm-cov/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Single required check for branch protection.
  ci:
    name: ci
    if: always()
    needs: [compile, test, docs, install, lint, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "needs: $results"
          echo "$results" | grep -qv 'failure' || exit 1
          echo "$results" | grep -qv 'cancelled' || exit 1
          echo "$results" | grep -q 'success'
