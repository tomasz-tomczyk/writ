name: CI

# Full suite on pull requests only — same split as crit (test.yml is
# pull_request-only; coverage.yml runs on main). Squash-merges already
# passed CI on the PR; re-running every job on main is wasted wall time.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Warm the shared Cargo cache and produce the writ binary once.
  # Downstream jobs restore the cache (or the binary artifact) instead of
  # cold-compiling on every runner.
  compile:
    name: compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      # `cargo install writ-cli` uses this package-to-bin mapping. Assert the
      # naming footgun directly instead of rebuilding the workspace to install it.
      - name: Check cargo install naming contract
        run: |
          mise exec -- cargo metadata --locked --no-deps --format-version 1 |
            jq -e 'any(.packages[]; .name == "writ-cli" and any(.targets[]; .name == "writ" and (.kind | index("bin"))))'

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Format
        run: mise exec -- cargo fmt --all --check

      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: No HTTP client is linked into writ
        run: mise run no-network

      - name: Compile tests (no run)
        run: mise exec -- cargo test --workspace --locked --no-run

      - name: Build writ
        run: mise exec -- cargo build --bin writ --locked

      - name: Upload writ binary
        uses: actions/upload-artifact@v7
        with:
          name: writ-bin
          path: target/debug/writ
          if-no-files-found: error
          retention-days: 1

  test:
    name: test
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false
      - name: Test
        run: mise exec -- cargo test --workspace --locked

  docs:
    name: docs
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download writ binary
        uses: actions/download-artifact@v8
        with:
          name: writ-bin
          path: artifact
      - name: README and every SKILL.md against writ --help
        env:
          WRIT: ${{ github.workspace }}/artifact/writ
        run: |
          chmod +x "$WRIT"
          ./scripts/check-doc-flags.sh

  # No compile needed (deny/machete/typos/shellcheck). Run beside compile.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - name: Supply-chain, unused deps, typos, shell scripts
        run: mise run lint

  # Instrumented rebuild cannot reuse compile's target/, so do not wait on
  # it — overlap with compile for wall-clock. Also runs on main via
  # coverage.yml so Codecov keeps a default-branch baseline.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: coverage
      - name: Generate LCOV
        run: mise run coverage
      - name: Upload to Codecov
        # Same pattern as crit: always upload with CODECOV_TOKEN. Add the
        # token as a Dependabot secret too (Actions secrets are not passed
        # to Dependabot workflows).
        uses: codecov/codecov-action@v7
        with:
          files: target/llvm-cov/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Single required check for branch protection.
  ci:
    name: ci
    if: always()
    needs: [compile, test, docs, lint, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "needs: $results"
          echo "$results" | grep -qv 'failure' || exit 1
          echo "$results" | grep -qv 'cancelled' || exit 1
          echo "$results" | grep -q 'success'
