name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One runner so fmt → clippy → test → docs → lint reuse the same target/
  # and toolchain. Parallel jobs each cold-compile; rust-cache only helps
  # the *next* run, not siblings in this one.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v3
        with:
          install: true
          cache: true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: mise exec -- cargo fmt --all --check

      - name: Clippy
        run: mise exec -- cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: No HTTP client is linked into writ
        run: mise run no-network

      - name: Test
        run: mise exec -- cargo test --workspace --locked

      - name: Build the binary the documentation is checked against
        run: mise exec -- cargo build --bin writ --locked

      # Spec section 11, from crit #873. A flag in the README or a
      # SKILL.md that the binary rejects is a bug. Invariant 8.
      - name: README and every SKILL.md against writ --help
        run: ./scripts/check-doc-flags.sh

      - name: cargo install resolves the writ binary
        run: |
          mise exec -- cargo install --path crates/writ-cli --locked --force
          writ --version

      - name: Supply-chain, unused deps, typos, shell scripts
        run: mise run lint

  # Separate job: llvm-cov rebuilds with instrumentation; do not share
  # the check job's target/ artifacts.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep instrumented artifacts out of the check cache key.
          prefix-key: coverage
      - name: Generate LCOV
        run: mise run coverage
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: target/llvm-cov/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
