name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Default every job to read-only; only the GitHub release job needs to write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release tags must point at main, where branch protection already required the
  # full PR suite. Repeating that suite on a tag adds a cold compile without
  # testing a new commit, so keep this gate to release provenance and metadata.
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          install_args: rust
          cache: true

      - name: Verify release provenance and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Tag checkouts do not necessarily have origin/main; fetch it explicitly.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::tag $TAG does not point at a commit on main"
            exit 1
          fi

          VERSION=$(mise exec -- cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "writ-cli") | .version')
          if [[ "$TAG" != "v$VERSION" ]]; then
            echo "::error::tag $TAG does not match workspace version $VERSION"
            exit 1
          fi

  nix:
    name: nix
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # nix-installer-action does not use OIDC; this gate only reads the checkout.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build and smoke-test the Nix package
        run: ./scripts/check-nix-build.sh

  build:
    name: build ${{ matrix.artifact }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon only on macOS — Intel runners are slow and sunsetting.
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: writ-darwin-arm64
            binary: writ
            strip: true
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: writ-linux-amd64
            binary: writ
            strip: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: writ-linux-arm64
            binary: writ
            strip: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: writ-windows-amd64.exe
            binary: writ.exe
            strip: false
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          install_args: rust
          cache: true

      - name: Install Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache already keys on OS and Rust; these keep matrix targets
          # isolated while allowing an exact hit when a tag run is retried.
          shared-key: release-build-${{ matrix.runner }}-${{ matrix.target }}

      - name: Build writ
        run: mise exec -- cargo build --release --locked --bin writ --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        env:
          STRIP_BINARY: ${{ matrix.strip }}
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.artifact }}"
          if [[ "$STRIP_BINARY" == "true" ]]; then
            strip "dist/${{ matrix.artifact }}"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [build, nix]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          chmod +x writ-* || true
          sha256sum writ-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/writ-*
            dist/checksums.txt

  homebrew:
    name: Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Update Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"

          SHA_DARWIN_ARM64=$(sha256sum dist/writ-darwin-arm64 | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(sha256sum dist/writ-linux-amd64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(sha256sum dist/writ-linux-arm64 | cut -d' ' -f1)

          BASE_URL="https://github.com/tomasz-tomczyk/writ/releases/download/${TAG}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/tomasz-tomczyk/homebrew-tap.git" homebrew-tap
          mkdir -p homebrew-tap/Formula

          cat > homebrew-tap/Formula/writ.rb <<FORMULA
          class Writ < Formula
            desc "Local-first ledger of the steering you give coding agents"
            homepage "https://github.com/tomasz-tomczyk/writ"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/writ-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/writ-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "${BASE_URL}/writ-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              binary = Dir["writ-*"].first || "writ"
              bin.install binary => "writ"
            end

            test do
              assert_match "${VERSION}", shell_output("#{bin}/writ --version").strip
            end
          end
          FORMULA

          cd homebrew-tap || exit 1
          git add Formula/writ.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update writ to ${TAG}"
          git push origin main

  crates:
    name: crates.io
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4
        with:
          install: true
          install_args: rust
          cache: true

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Stable across crates.io publish retries; rust-cache adds the OS,
          # toolchain, and Cargo manifest/lockfile hashes to this shared key.
          shared-key: release-workspace

      - name: Publish writ-core
        run: mise exec -- cargo publish --locked -p writ-core

      - name: Publish writ-cli
        run: |
          for attempt in 1 2 3 4 5; do
            if mise exec -- cargo publish --locked -p writ-cli; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              exit 1
            fi
            echo "writ-core is not visible in the crates.io index yet; retrying in 15 seconds"
            sleep 15
          done
