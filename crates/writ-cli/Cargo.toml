[package]
name = "writ-cli"
description = "writ: a local-first ledger of the steering you give coding agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "writ"
path = "src/main.rs"

[lib]
name = "writ_cli"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
clap.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
# `preserve_order` is not a preference. `writ install` merges into live
# host configuration files, and the default map reorders every key it
# rewrites, which turns a one-key addition into a whole-file diff.
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
rust-embed.workspace = true
# `writ install codex` parses config.toml to decide whether writ is
# already registered. It never reprints it: see install.rs.
toml.workspace = true
writ-core = { path = "../writ-core", version = "0.1.0" }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower.workspace = true
serde_urlencoded.workspace = true
