[tools]
# components are explicit so CI installs the same toolchain as a laptop.
# Without them, `mise exec -- cargo fmt` fails on a clean machine.
rust = { version = "1.98.1", components = "rustfmt,clippy" }
# ast-grep is declared because the matcher tests shell out to it. Without
# it the suite passes on a laptop that happens to have it and fails on a
# clean machine, which is how CI caught this.
ast-grep = "0.45.3"

[tasks.test]
description = "Run the full test suite"
run = "cargo test --workspace"

[tasks.check]
description = "Format, lint, and test"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "mise run no-network",
  "cargo test --workspace",
]

[tasks.docs]
description = "Check every flag in the README and the skills against writ --help"
run = [
  "cargo build --bin writ",
  "./scripts/check-doc-flags.sh",
]

[tasks.no-network]
description = "Assert the writ binary has no HTTP client dependency"
run = '''
if cargo tree -p writ-cli --edges normal | grep -E '(^| )((reqwest|ureq|isahc|curl|surf) v)'; then
  echo "an HTTP client is linked into writ; telemetry must remain local-only" >&2
  exit 1
fi
if grep -R -E 'reqwest::|ureq::|isahc::|curl::|surf::|TcpStream|UdpSocket|hyper::client' crates/*/src; then
  echo "network client code exists in writ; telemetry must remain local-only" >&2
  exit 1
fi
'''

[tasks.build]
description = "Build the writ binary"
run = "cargo build --release"
